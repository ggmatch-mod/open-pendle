[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["vendor"]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/=vendor/@openzeppelin/"]

[fuzz]
runs = 128
